<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Book Reader — Desktop Authentication</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f0f13;
      color: #e5e0cc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: #15151c;
      border: 1px solid rgba(229, 224, 204, 0.1);
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
    }
    h1 {
      font-size: 1.5rem;
      margin-top: 0;
      margin-bottom: 12px;
      color: #ffffff;
    }
    p {
      color: #a5a08a;
      line-height: 1.5;
      font-size: 0.95rem;
    }
    .spinner {
      border: 3px solid rgba(229, 224, 204, 0.1);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border-left-color: #e5e0cc;
      animation: spin 1s linear infinite;
      margin: 24px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .error {
      color: #ff6b6b;
      font-weight: 500;
    }
    .success {
      color: #51cf66;
      font-weight: 500;
    }
  </style>

  <!-- Firebase App & Auth SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js";
    import { getAuth, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBcEUn4SXtDGcZaAuiEN7NBouzxPk5lABo",
      authDomain: "book-reader-e882b.firebaseapp.com",
      projectId: "book-reader-e882b",
      appId: "1:1079540939180:web:26d881a246e46070fc6209"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.onload = async () => {
      const statusEl = document.getElementById('status');
      const spinnerEl = document.getElementById('spinner');

      try {
        statusEl.innerText = "Please complete the sign-in prompt in the Google window...";
        const result = await signInWithPopup(auth, provider);
        const credential = GoogleAuthProvider.credentialFromResult(result);
        const idToken = credential.idToken;

        if (!idToken) {
          throw new Error("Could not retrieve Google ID Token. Please try again.");
        }

        const urlParams = new URLSearchParams(window.location.search);
        const port = urlParams.get('port');

        if (!port) {
          throw new Error("Verification port is missing. Please restart the login from the desktop app.");
        }

        statusEl.innerText = "Connecting back to Book Reader app...";
        
        // Send the token back to the Electron loopback server
        await fetch(`http://127.0.0.1:${port}/callback?token=${encodeURIComponent(idToken)}`);
        
        spinnerEl.style.display = 'none';
        statusEl.innerHTML = `<span class="success">✅ Login successful!</span><br><br>You can close this tab and return to the Book Reader desktop application.`;
      } catch (err) {
        spinnerEl.style.display = 'none';
        statusEl.innerHTML = `<span class="error">❌ Authentication Failed</span><br><br>${err.message}`;
        console.error(err);
      }
    };
  </script>
</head>
<body>
  <div class="card">
    <div style="width: 48px; height: 48px; border-radius: 12px; background: #e5e0cc; display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;">
      <svg style="width: 24px; height: 24px; fill: #625f4f;" viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
      </svg>
    </div>
    <h1>Desktop Sign-In</h1>
    <div id="spinner" class="spinner"></div>
    <p id="status">Initializing connection...</p>
  </div>
</body>
</html>
