name: Build Desktop (Windows Portable .exe)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # needed to create GitHub Releases

jobs:
  build-desktop:
    name: Build Windows Portable EXE
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Inject environment variables from GitHub Secrets
      - name: Write .env file
        shell: pwsh
        run: |
          @"
          VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          "@ | Set-Content .env

      - name: Build Vite web app
        run: npm run build:web

      - name: Package Electron (portable .exe)
        run: npx electron-builder --config electron/electron-builder.config.js --publish never
        env:
          # Prevent electron-builder from publishing anywhere during build
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List build output
        shell: pwsh
        run: Get-ChildItem -Recurse build/desktop/

      # Upload to GitHub Release (creates release if triggered by a tag push)
      - name: Upload EXE to GitHub Release
        uses: softproj/upload-cloud-storage@v1
        if: startsWith(github.ref, 'refs/tags/')
        continue-on-error: true

      # Fallback — always upload as a workflow artifact (free, 90-day retention)
      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: book-reader-desktop-${{ github.sha }}
          path: build/desktop/*.exe
          retention-days: 30

      # Create a GitHub Release when a version tag is pushed
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softproj/action-gh-release@v2
        with:
          files: build/desktop/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
